# サイト基本情報
title: AI推論基盤 mdx-MaaS
# description（検索結果に出る説明文）は各ページのフロントマターで指定する。
# ここに site.description を書くと、トップページの <title> が
# 「AI推論基盤 mdx-MaaS | 生成AIモデルを…」のように description と連結されてしまうため
# （jekyll-seo-tag は page.title と site.title が一致する場合に description を連結する仕様）。
lang: ja
timezone: Asia/Tokyo

# 公開URL（カスタムドメイン運用。baseurl はサブパス不要のため空）
url: "https://maas.mdx1.jp"
baseurl: ""

# テーマ
theme: minima

# ヘッダーのナビゲーションに表示するページ
# （ユーザーポータルはトップページ（index.md）そのもの、チャットサービス利用案内へは
#   ユーザーポータルの FAQ からのみ誘導するため、意図的にナビに含めない）
header_pages:
  - updates.md

# プラグイン（GitHub Pages 標準で利用可能なもののみ）
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-relative-links

# Markdown 内の相対リンク（例: [チャットサービス利用案内](chat.md)）を
# 公開URLに自動変換する
relative_links:
  enabled: true

# サイトとして公開しないファイル
# （Jekyll 3 では exclude を指定するとデフォルト値が上書きされるため、
#   vendor/ などローカル環境のディレクトリも明示的に除外する）
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - node_modules/
