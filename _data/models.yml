# 利用可能なモデル一覧（正式版）
#
# このファイルから、利用可能なモデル一覧ページ（models.md）と
# トップページ（index.md）の「現在利用可能なモデル」の表を生成する。
#
# モデルを追加・変更・削除したら、次の 2 つの last_modified_at も同じ日付に更新すること
# （sitemap.xml の lastmod になり、Google が再クロールする手がかりになる）。
#   - models.md
#   - index.md
#
# 項目:
#   name:                 API の model パラメータに指定する値
#   description:          モデルの説明（改行はそのままページの改行になる）
#   chat:                 即時応答 API で使えるか（true / false）
#   batch:                Batch API で使えるか（true / false）
#   cold_start:           アクセスがないときに停止していて、起動待ちが発生するか（true / false）
#   max_context_len:      本サービスでの最大コンテキスト長（トークン）
#   original_context_len: モデル本来のコンテキスト長（トークン）

